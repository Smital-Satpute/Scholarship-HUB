<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Details</title>
    <link rel="stylesheet" href="scholarship.css"> 
</head>
<body>
    <header>
        <div class="logo">
            <img src="Images/ourlogo.png" alt="Scholarship Hub Logo">
        </div>
        <nav>
            <ul>
                <li><a href="dashboard.html"><button id="logout-btn">Home</button></a></li>
                <li><a href="index.html"><button id="logout-btn">Logout</button></a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="scholarship-details">
            <h2 id="scholarship-name"></h2>

            <section id="about-section">
                <h3 class="name">About</h3>
                <p id="about-text"></p>
            </section>

            <section id="about-section">
                <h3 class="name">Description</h3>
                <p id="about-desc"></p>
            </section>

            <section id="applicable-section">
                <h3 class="name">Applicable For</h3>
                <p id="applicable-text"></p>
            </section>

            <section id="application-record-section">
                <h3 class="name">Application Record</h3>
                <p id="application-record-text"></p>
            </section>

            <section id="official-website-section">
                <h3 class="name">Official Website</h3>
                <p id="official-website-text"></p>
            </section>

            <section id="steps-section">
                <h3 class="name">Steps to Apply</h3>
                <p id="steps-text"></p>
            </section>

            <section id="documents-section">
                <h3 class="name">Documents Required</h3>
                <p id="documents-text"></p>
            </section>

            <section id="remarks-section">
                <h3 class="name">Remarks</h3>
                <p id="remarks-text"></p>
            </section>

            <h3 class="name">Video Link</h3>
            <div id="video-section">
                <iframe id="video-link" width="800" height="450" src="" frameborder="0" allowfullscreen></iframe>
            </div>

            <section id="email-section">
                <h3 class="name">Email Details</h3>
                <p id="email-text"></p>
            </section>

            <section id="contact-section">
                <h3 class="name">Contact Details</h3>
                <p id="contact-text"></p>
            </section>

            <section id="address-section">
                <h3 class="name">Address</h3>
                <p id="address-text"></p>
            </section>
        </div>
    </main>

    <script src="scholarship.js"></script>
</body>
</html>
